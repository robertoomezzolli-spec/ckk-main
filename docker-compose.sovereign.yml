services:
  ckk-knowledge:
    build:
      context: .
      dockerfile: Dockerfile.ckk-knowledge
    restart: unless-stopped
    env_file: .env.ckk-knowledge
    environment:
      CKK_REPOSITORY_URL: https://github.com/robertoomezzolli-spec/ckk.git
      CKK_REPOSITORY_REF: main
      CKK_CACHE_DIRECTORY: /cache
      CKK_REFRESH_SECONDS: "900"
    volumes:
      - ckk-knowledge-cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  organism:
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    restart: unless-stopped
    env_file:
      - .env.sovereign
      - .env.ckk-knowledge
    environment:
      CKK_ADAPTER_URL: http://ckk-knowledge:8070
      CKK_MAXIMUM_RESULTS: "6"
    depends_on:
      ckk-knowledge:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - sovereign-state:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sovereign-state:
  ckk-knowledge-cache:
