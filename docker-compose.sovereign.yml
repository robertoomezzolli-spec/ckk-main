services:
  ckk-knowledge:
    build:
      context: .
      dockerfile: Dockerfile.ckk-knowledge
    restart: unless-stopped
    env_file: .env.ckk-knowledge
    environment:
      CKK_REPOSITORY_URL: git@github.com:robertoomezzolli-spec/ckk.git
      CKK_REPOSITORY_REF: main
      CKK_CACHE_DIRECTORY: /cache
      CKK_REFRESH_SECONDS: "900"
      CKK_GIT_SSH_KEY: /run/secrets/ckk_readonly_key
      CKK_GIT_KNOWN_HOSTS: /run/secrets/ckk_github_known_hosts
    volumes:
      - ckk-knowledge-cache:/cache
      - ckk-run-jobs:/jobs
    secrets:
      - ckk_readonly_key
      - ckk_github_known_hosts
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ckk-runner:
    image: ckk-knowledge:local
    restart: unless-stopped
    depends_on:
      ckk-knowledge:
        condition: service_started
    command: ["python", "-m", "ckk.knowledge_adapter.runner_worker"]
    volumes:
      - ckk-knowledge-cache:/source-cache:ro
      - ckk-run-jobs:/jobs
      - ckk-run-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=96m,noexec,nosuid
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
      test: ["CMD", "python", "-m", "ckk.knowledge_adapter.runner_worker", "--health"]

  organism:
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    restart: unless-stopped
    env_file:
      - .env.sovereign
      - .env.ckk-knowledge
    environment:
      CKK_ADAPTER_URL: http://ckk-knowledge:8070
      CKK_MAXIMUM_RESULTS: "6"
    depends_on:
      ckk-knowledge:
        condition: service_healthy
      ckk-runner:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - sovereign-state:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sovereign-state:
  ckk-knowledge-cache:
  ckk-run-jobs:
  ckk-run-artifacts:

secrets:
  ckk_readonly_key:
    file: .secrets/ckk_readonly_key
  ckk_github_known_hosts:
    file: .secrets/github_known_hosts
