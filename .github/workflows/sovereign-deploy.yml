name: Sovereign production deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sovereign-deploy.yml"
      - "control/deadman-public.pem"
      - "control/deadman-lease.json"

permissions:
  contents: write

concurrency:
  group: sovereign-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Acquire one-time deploy credentials
        env:
          SSH_KEY: ${{ secrets.SOVEREIGN_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          if [[ -n "$SSH_KEY" ]]; then
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/sovereign-01"
          else
            work=/tmp/kairos-bootstrap
            install -d -m 700 "$work"
            openssl req -x509 -newkey rsa:3072 -nodes -days 1 \
              -subj '/CN=kairos-ephemeral-runner' \
              -keyout "$work/runner.key" -out "$work/runner.crt" >/dev/null 2>&1
            install -d .github/deploy
            install -m 644 "$work/runner.crt" .github/deploy/runner.crt
            git config user.name 'kairos-deploy-runner'
            git config user.email 'kairos-deploy@users.noreply.github.com'
            git add .github/deploy/runner.crt
            git commit -m "Publish ephemeral deploy certificate [skip ci]"
            git push origin HEAD:main
            echo "Waiting for the encrypted one-time payload"
            for attempt in $(seq 1 120); do
              if curl -fsSL \
                "https://raw.githubusercontent.com/robertoomezzolli-spec/ckk-main/main/.github/deploy/payload.cms.b64?run=${GITHUB_RUN_ID}&attempt=${attempt}" \
                -o "$work/payload.cms.b64"; then
                if base64 -d "$work/payload.cms.b64" > "$work/payload.cms" 2>/dev/null && \
                   openssl cms -decrypt -inform DER \
                     -in "$work/payload.cms" \
                     -recip "$work/runner.crt" \
                     -inkey "$work/runner.key" \
                     -out "$work/credentials.tar" 2>/dev/null; then
                  tar -xf "$work/credentials.tar" -C "$work"
                  install -m 600 "$work/sovereign-01" "$HOME/.ssh/sovereign-01"
                  install -m 600 "$work/openai-key" /tmp/kairos-openai-key
                  break
                fi
              fi
              sleep 5
            done
            test -s "$HOME/.ssh/sovereign-01"
          fi
          chmod 600 "$HOME/.ssh/sovereign-01"
          ssh-keyscan -T 10 -H 206.189.55.212 > "$HOME/.ssh/known_hosts"

      - name: Install control plane and deploy
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/sovereign-01" -o BatchMode=yes -o StrictHostKeyChecking=yes root@206.189.55.212)
          SCP=(scp -i "$HOME/.ssh/sovereign-01" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" 'install -d -m 755 /opt/sovereign/control'
          "${SCP[@]}" control/deadman-public.pem control/deadman-lease.json root@206.189.55.212:/opt/sovereign/control/

          if [[ -s /tmp/kairos-openai-key ]]; then
            "${SCP[@]}" /tmp/kairos-openai-key root@206.189.55.212:/tmp/kairos-openai-key
          fi

          "${SSH[@]}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/sovereign
          git -c safe.directory=/opt/sovereign fetch origin main
          git -c safe.directory=/opt/sovereign reset --hard origin/main
          chmod 644 control/deadman-public.pem control/deadman-lease.json
          test ! -e control/KILL
          if [[ -s /tmp/kairos-openai-key ]]; then
            python3 - <<'PY'
          from pathlib import Path
          env_path = Path('/opt/sovereign/.env.sovereign')
          secret = Path('/tmp/kairos-openai-key').read_text().strip()
          lines = env_path.read_text().splitlines()
          lines = [('OPENAI_API_KEY=' + secret) if line.startswith('OPENAI_API_KEY=') else line for line in lines]
          env_path.write_text('\n'.join(lines) + '\n')
          PY
            chmod 600 .env.sovereign
            shred -u /tmp/kairos-openai-key 2>/dev/null || rm -f /tmp/kairos-openai-key
          fi
          if ! bash deploy/digitalocean/deploy.sh; then
            docker compose -f docker-compose.digitalocean.yml ps --all || true
            docker compose -f docker-compose.digitalocean.yml logs --no-color --tail=200 organism || true
            exit 1
          fi
          REMOTE

      - name: Verify HTTPS health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if body=$(curl --fail --silent --show-error --max-time 10 https://kairos.206-189-55-212.sslip.io/healthz); then
              echo "KAIROS_HEALTH_OK $body"
              exit 0
            fi
            sleep 2
          done
          echo "KAIROS health check failed"
          exit 1

      - name: Remove one-time encrypted material
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/deploy/runner.crt .github/deploy/payload.cms.b64
          if [[ -n "$(git status --short)" ]]; then
            git config user.name 'kairos-deploy-runner'
            git config user.email 'kairos-deploy@users.noreply.github.com'
            git add -A .github/deploy
            git commit -m "Remove one-time deploy payload [skip ci]"
            git push origin HEAD:main
          fi
