name: cycle-period-class

on:
  push:
    branches:
      - experiment/solar-system-provenance-cascade
    paths:
      - experiments/cycle_period_class_test.py
      - .github/workflows/cycle-period-class.yml
  workflow_dispatch:

jobs:
  period-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run period-class test
        run: python experiments/cycle_period_class_test.py
      - name: Show result
        run: cat results/cycle_period_class.json
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-period-class
          path: results/cycle_period_class.json
