name: causal-approach-dilation

on:
  push:
    branches:
      - experiment/solar-system-provenance-cascade
    paths:
      - experiments/causal_approach_dilation_gate.py
      - .github/workflows/causal-approach-dilation.yml
      - ckk_snapshot/ckk/gen/grammar.py
      - ckk_snapshot/ckk/gen/expand.py
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run blind causal approach dilation gate
        run: python experiments/causal_approach_dilation_gate.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: causal-approach-dilation-result
          path: results/causal_approach_dilation_gate.json
          if-no-files-found: error
