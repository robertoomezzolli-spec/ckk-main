name: curvature-missing-state
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run curvature missing-state test
        run: python experiments/curvature_missing_state_test.py
      - name: Show result
        if: always()
        run: cat results/curvature_missing_state.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curvature-missing-state-result
          path: results/curvature_missing_state.json
