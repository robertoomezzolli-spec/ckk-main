name: single-resistance-unification-gate
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run single-resistance unification gate
        run: python experiments/single_resistance_unification_gate.py
      - name: Show result
        if: always()
        run: cat results/single_resistance_unification_gate.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-resistance-unification-gate-result
          path: results/single_resistance_unification_gate.json
