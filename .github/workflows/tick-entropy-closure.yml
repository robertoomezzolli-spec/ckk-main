name: tick-entropy-closure
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tick entropy closure gate
        run: python experiments/tick_entropy_closure_gate.py
      - name: Show result
        if: always()
        run: cat results/tick_entropy_closure_gate.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tick-entropy-closure-result
          path: results/tick_entropy_closure_gate.json
