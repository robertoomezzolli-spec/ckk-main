name: closure-projection-dimension
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run higher closure projection test
        run: python experiments/closure_projection_dimension_test.py
      - name: Show result
        run: cat results/closure_projection_dimension.json
      - uses: actions/upload-artifact@v4
        with:
          name: closure-projection-dimension-result
          path: results/closure_projection_dimension.json
