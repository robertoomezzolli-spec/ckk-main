name: satellite-raw-ingest-gate
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run raw ILRS ingestion gate
        run: python experiments/satellite_raw_ingest_gate.py
      - name: Show result
        if: always()
        run: cat results/satellite_raw_ingest_gate.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satellite-raw-ingest-gate-result
          path: results/satellite_raw_ingest_gate.json
