name: fresh-seed-fiber-jump-gate

on:
  push:
    branches:
      - experiment/solar-system-provenance-cascade
    paths:
      - experiments/fresh_seed_fiber_jump_gate.py
      - .github/workflows/fresh-seed-fiber-jump-gate.yml
      - ckk_snapshot/ckk/gen/**
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run preregistered fresh-seed fiber jump gate
        run: python experiments/fresh_seed_fiber_jump_gate.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fresh-seed-fiber-jump-result
          path: results/fresh_seed_fiber_jump_gate.json
          if-no-files-found: error
