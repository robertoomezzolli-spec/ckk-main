name: basel-then-riemann
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Basel then Riemann gate
        run: python experiments/basel_then_riemann_gate.py
      - name: Show result
        if: always()
        run: cat results/basel_then_riemann_gate.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basel-then-riemann-result
          path: results/basel_then_riemann_gate.json
