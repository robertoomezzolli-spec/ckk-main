name: jump-hysteresis-gate

on:
  push:
    branches:
      - experiment/solar-system-provenance-cascade
    paths:
      - experiments/jump_hysteresis_gate.py
      - .github/workflows/jump-hysteresis-gate.yml
      - ckk_snapshot/ckk/gen/grammar.py
      - ckk_snapshot/ckk/gen/expand.py
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run blind jump hysteresis gate
        run: python experiments/jump_hysteresis_gate.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: jump-hysteresis-gate-result
          path: results/jump_hysteresis_gate.json
          if-no-files-found: error
