services:
  ckk-knowledge:
    image: ckk-knowledge:local
    build:
      context: .
      dockerfile: Dockerfile.ckk-knowledge
    restart: unless-stopped
    env_file:
      - .env.ckk-knowledge
    environment:
      CKK_REPOSITORY_URL: git@github.com:robertoomezzolli-spec/ckk.git
      CKK_REPOSITORY_REF: main
      CKK_CACHE_DIRECTORY: /cache
      CKK_REFRESH_SECONDS: "900"
      CKK_GIT_SSH_KEY: /run/secrets/ckk_readonly_key
      CKK_GIT_KNOWN_HOSTS: /run/secrets/ckk_github_known_hosts
      CKK_RUN_ARTIFACT_DIRECTORY: /run-artifacts
      CKK_PUBLICATION_DIRECTORY: /publications
      CKK_RESEARCH_BASE_URL: https://kairos.206-189-55-212.sslip.io/research
    expose:
      - "8070"
    volumes:
      - ckk-knowledge-cache:/cache
      - ckk-run-jobs:/jobs
      - ckk-run-artifacts:/run-artifacts:ro
      - ckk-research-publications:/publications
    secrets:
      - ckk_readonly_key
      - ckk_github_known_hosts
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  ckk-runner:
    image: ckk-knowledge:local
    restart: unless-stopped
    depends_on:
      ckk-knowledge:
        condition: service_started
    command: ["python", "-m", "ckk.knowledge_adapter.runner_worker"]
    volumes:
      - ckk-knowledge-cache:/source-cache:ro
      - ckk-run-jobs:/jobs
      - ckk-run-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=96m,noexec,nosuid
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
      test: ["CMD", "python", "-m", "ckk.knowledge_adapter.runner_worker", "--health"]

  research-site:
    image: ckk-knowledge:local
    restart: unless-stopped
    depends_on:
      ckk-knowledge:
        condition: service_healthy
    command: ["uvicorn", "ckk.knowledge_adapter.research_site_asgi:app", "--host", "0.0.0.0", "--port", "8060", "--workers", "1"]
    expose:
      - "8060"
    volumes:
      - ckk-research-publications:/publications:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    healthcheck:
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8060/healthz', timeout=2)"]

  organism:
    image: ckk-sovereign:local
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    restart: unless-stopped
    env_file:
      - .env.sovereign
      - .env.observatory-ingest
      - .env.ckk-knowledge
    environment:
      CKK_ADAPTER_URL: http://ckk-knowledge:8070
      CKK_MAXIMUM_RESULTS: "6"
    depends_on:
      ckk-knowledge:
        condition: service_healthy
      ckk-runner:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - sovereign-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  observatory:
    image: ckk-observatory:local
    build:
      context: .
      dockerfile: Dockerfile.observatory
    restart: unless-stopped
    env_file:
      - .env.observatory
      - .env.observatory-ingest
    expose:
      - "8090"
    volumes:
      - observatory-state:/observatory
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  backup:
    image: ckk-sovereign:local
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      organism:
        condition: service_healthy
    command:
      - python
      - -m
      - ckk.sovereign.backup
      - --database
      - /data/sovereign.sqlite3
      - --destination
      - /data/backups
      - --interval
      - "21600"
      - --retain
      - "28"
    volumes:
      - sovereign-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      organism:
        condition: service_healthy
      observatory:
        condition: service_healthy
      research-site:
        condition: service_healthy
    env_file: .env.digitalocean
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - internal

volumes:
  sovereign-state:
  observatory-state:
  ckk-knowledge-cache:
  ckk-run-jobs:
  ckk-run-artifacts:
  ckk-research-publications:
  caddy-data:
  caddy-config:

networks:
  internal:

secrets:
  ckk_readonly_key:
    file: .secrets/ckk_readonly_key
  ckk_github_known_hosts:
    file: .secrets/github_known_hosts
