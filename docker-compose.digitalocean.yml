services:
  ckk-knowledge:
    image: ckk-knowledge:local
    build:
      context: .
      dockerfile: Dockerfile.ckk-knowledge
    restart: unless-stopped
    env_file:
      - .env.ckk-knowledge
    environment:
      CKK_REPOSITORY_URL: https://github.com/robertoomezzolli-spec/ckk.git
      CKK_REPOSITORY_REF: main
      CKK_CACHE_DIRECTORY: /cache
      CKK_REFRESH_SECONDS: "900"
    expose:
      - "8070"
    volumes:
      - ckk-knowledge-cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  organism:
    image: ckk-sovereign:local
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    restart: unless-stopped
    env_file:
      - .env.sovereign
      - .env.observatory-ingest
      - .env.ckk-knowledge
    environment:
      CKK_ADAPTER_URL: http://ckk-knowledge:8070
      CKK_MAXIMUM_RESULTS: "6"
    depends_on:
      ckk-knowledge:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - sovereign-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  observatory:
    image: ckk-observatory:local
    build:
      context: .
      dockerfile: Dockerfile.observatory
    restart: unless-stopped
    env_file:
      - .env.observatory
      - .env.observatory-ingest
    expose:
      - "8090"
    volumes:
      - observatory-state:/observatory
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  backup:
    image: ckk-sovereign:local
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      organism:
        condition: service_healthy
    command:
      - python
      - -m
      - ckk.sovereign.backup
      - --database
      - /data/sovereign.sqlite3
      - --destination
      - /data/backups
      - --interval
      - "21600"
      - --retain
      - "28"
    volumes:
      - sovereign-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      organism:
        condition: service_healthy
      observatory:
        condition: service_healthy
    env_file: .env.digitalocean
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - internal

volumes:
  sovereign-state:
  observatory-state:
  ckk-knowledge-cache:
  caddy-data:
  caddy-config:

networks:
  internal:
